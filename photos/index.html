    <span class="sep" aria-hidden="true">/</span>
    <h1>Photos</h1>
  </div>
  <div class="lang-toggle" role="group" aria-label="Language">
    <a href="../es/fotos/" hreflang="es" lang="es" title="Versión en español"><svg class="flag" viewBox="0 0 3 2" preserveAspectRatio="none" aria-hidden="true" focusable="false"><rect width="3" height="2" fill="#AA151B"/><rect y=".5" width="3" height="1" fill="#F1BF00"/></svg>ES</a>
    <span aria-current="true"><svg class="flag" viewBox="0 0 60 30" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false"><clipPath id="uk-diag"><path d="M30,15h30v15zv15h-30zh-30v-15zv-15h30z"/></clipPath><path d="M0,0v30h60v-30z" fill="#012169"/><path d="M0,0L60,30M60,0L0,30" stroke="#fff" stroke-width="6"/><path d="M0,0L60,30M60,0L0,30" clip-path="url(#uk-diag)" stroke="#C8102E" stroke-width="4"/><path d="M30,0v30M0,15h60" stroke="#fff" stroke-width="10"/><path d="M30,0v30M0,15h60" stroke="#C8102E" stroke-width="6"/></svg>EN</span>

</header>

<main class="stage">
  <figure class="frame" id="frame">
    <img id="photo" alt="" decoding="async">
    <div class="spinner" aria-hidden="true"></div>
    <p class="error">Could not load this photo.</p>
    <button class="nav prev" type="button" aria-label="Previous photo" title="Previous (←)"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button class="nav next" type="button" aria-label="Next photo" title="Next (→)"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </figure>
</main>

<footer class="dock">
  <div class="caption" aria-live="polite">
    <div class="place" id="place"></div>
    <div class="meta" id="meta"></div>
  </div>
  <div class="controls">
    <span class="count" id="count"></span>
    <button class="btn" id="random" type="button" aria-label="Random photo" title="Random photo (R)"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h3.5c2 0 3.2 1 4.3 2.6l2.4 4.8c1.1 1.6 2.3 2.6 4.3 2.6H21"/><path d="M3 17h3.5c1.6 0 2.7-.6 3.6-1.7"/><path d="M14.4 8.7c.9-1.1 2-1.7 3.1-1.7H21"/><path d="M18 4l3 3-3 3"/><path d="M18 14l3 3-3 3"/></svg><span class="label">Random</span></button>
